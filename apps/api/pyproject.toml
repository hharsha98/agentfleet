[project]
name = "agentfleet-api"
version = "0.1.0"
description = "AgentFleet API — multi-agent operations platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "langfuse>=2.60",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.18",
    "mcp>=1.2",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "trafilatura>=1.12",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "arq>=0.26",
    "croniter>=2.0",
    "pydantic-ai-slim[openai]>=0.0.14",
    "sentry-sdk[fastapi]>=2.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
