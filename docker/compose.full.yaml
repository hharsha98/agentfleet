# One-command full stack: infra (postgres, redis, searxng) + api + web.
#
#   cp .env.example .env   # fill in your LLM keys
#   docker compose -f docker/compose.full.yaml up --build
#   open http://localhost:3002
#
# Networking note: the browser talks to the api at http://localhost:8000
# (published port), while the web container's SSR fetches happen inside the
# compose network. NEXT_PUBLIC_API_URL is baked into the client bundle as
# http://localhost:8000 (reachable from the host browser), so any *server*
# component fetch that happens during SSR from *inside* the web container
# will also try localhost:8000 — which isn't the api container from inside
# the network. That's acceptable for this local demo: pages using SSR fetch
# degrade to client-side re-fetch (see apps/web/app/chat/page.tsx and
# components/api-status.tsx, both client components that already re-fetch on
# mount), so the UI still loads correctly once the browser makes the request.
name: agentfleet

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentfleet
      POSTGRES_PASSWORD: agentfleet
      POSTGRES_DB: agentfleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/

  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@postgres:5432/agentfleet
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      FREE_LLM_BASE_URL: ${FREE_LLM_BASE_URL:-}
      FREE_LLM_KEY: ${FREE_LLM_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  pgdata:
