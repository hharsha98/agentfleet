# One-command full stack: infra (postgres, redis, searxng) + api + web.
#
#   cp .env.example .env   # fill in your LLM keys
#   docker compose -f docker/compose.full.yaml up --build
#   open http://localhost:3002
#
# Networking note: the browser talks to the api at http://localhost:8000
# (published port, NEXT_PUBLIC_API_URL baked into the client bundle), while
# the web container's *server-side* (SSR) fetches go straight to the api
# container over the compose network via INTERNAL_API_URL=http://api:8000
# (Phase 12 F2 — read at runtime by apiFetchServer in apps/web/lib/api.ts).
#
# Migrations (Phase 12 F2): the one-shot `migrate` service runs
# `alembic upgrade head` exactly once; api and worker only start after it
# exits 0 (service_completed_successfully). This avoids multiple replicas
# racing migrations at boot — the per-replica entrypoint no longer migrates.
name: agentfleet

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentfleet
      POSTGRES_PASSWORD: agentfleet
      POSTGRES_DB: agentfleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/

  # One-shot migration runner (Phase 12 F2): same image as the api, skips
  # docker-entrypoint.sh (entrypoint: []) and just applies migrations, then
  # exits 0. api/worker wait for it via service_completed_successfully.
  migrate:
    build:
      context: ../apps/api
    entrypoint: []
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@postgres:5432/agentfleet
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@postgres:5432/agentfleet
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      FREE_LLM_BASE_URL: ${FREE_LLM_BASE_URL:-}
      FREE_LLM_KEY: ${FREE_LLM_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      # Full-stack compose run: mission runs execute durably on the `worker`
      # service instead of dying with the api container (ADR-004).
      ORCHESTRATOR_MODE: arq
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started

  worker:
    build:
      context: ../apps/api
    # Skip docker-entrypoint.sh (migrate/seed — the api service already does
    # that); just run the arq worker so mission runs survive an api restart.
    entrypoint: []
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@postgres:5432/agentfleet
      REDIS_URL: redis://redis:6379/0
      SEARXNG_URL: http://searxng:8080
      FREE_LLM_BASE_URL: ${FREE_LLM_BASE_URL:-}
      FREE_LLM_KEY: ${FREE_LLM_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      ORCHESTRATOR_MODE: arq
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3002:3002"
    # The web app MINTS the API JWT (apps/web/lib/api.ts signApiToken) and the
    # api VERIFIES it (apps/api/app/auth.py) -- both with AUTH_SECRET. This
    # service had no env_file at all, so AUTH_SECRET was never set here and
    # signApiToken threw "AUTH_SECRET is not configured": every gated page
    # failed while the api container looked perfectly healthy. Same ../.env
    # the api service above uses, so the two secrets cannot drift apart.
    #
    # AUTH_SECRET is deliberately NOT re-declared under `environment:` below.
    # compose lets `environment:` override `env_file:`, so writing
    # `AUTH_SECRET: ${AUTH_SECRET:-}` would substitute the HOST shell's value
    # -- usually empty -- and that empty string would silently win over the
    # real value from ../.env.
    env_file:
      - ../.env
    environment:
      # SSR fetches reach the api over the compose network (runtime env, not
      # baked at build time like NEXT_PUBLIC_API_URL) — Phase 12 F2.
      INTERNAL_API_URL: http://api:8000
      # Auth.js rejects requests whose Host header it does not recognise. In
      # compose the browser arrives as localhost:3002 while the container sees
      # its own hostname, which trips UntrustedHost on every gated route.
      AUTH_TRUST_HOST: "true"
    depends_on:
      - api

volumes:
  pgdata:
