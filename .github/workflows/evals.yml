name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentfleet
          POSTGRES_PASSWORD: agentfleet
          POSTGRES_DB: agentfleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentfleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@localhost:5432/agentfleet
      # Dummy HS256 signing secret for the test suite (Phase 12 B auth) — not
      # a real credential, just needs to be present so app.auth.current_user
      # doesn't fail CLOSED with 503. tests/conftest.py mints its tokens with
      # this exact same value.
      AUTH_SECRET: test-secret-for-ci
      # Secrets are allowed in job-level env, but NOT in a step's `if:` — so we
      # surface the key here and gate the eval step on env below.
      FREE_LLM_KEY: ${{ secrets.FREE_LLM_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Exact version, not a floating major: astral-sh/setup-uv publishes no
      # `v9` tag — only `v9.0.0` — so `@v9` fails to resolve and the job dies
      # before it starts. actions/* do publish moving majors; this repo does
      # not, so pin it precisely.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Run migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Seed built-in agents
        working-directory: apps/api
        run: uv run python -m scripts.seed_agents

      - name: Run tests
        working-directory: apps/api
        run: uv run pytest -q

      # LLM eval gate: runs scripts.run_evals against a real provider, so it
      # needs a provider key secret. Guarded + non-blocking so PRs from forks
      # (or repos that haven't configured the secret yet) don't fail CI —
      # this job is the regression gate, meant to be tightened once
      # FREE_LLM_KEY / ANTHROPIC_API_KEY are configured as repo secrets.
      - name: Run LLM eval gate
        if: ${{ env.FREE_LLM_KEY != '' }}
        continue-on-error: true
        working-directory: apps/api
        run: |
          uv run python -m scripts.seed_evals
          uv run python -m scripts.run_evals
