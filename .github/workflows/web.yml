name: web

# The frontend had NO CI at all: evals.yml runs pytest and nothing else, so
# a TypeScript error or a broken page could reach main unnoticed. That
# matters more now that a cloud deploy is next.
#
# `next build` typechecks as part of building, so this single step is both
# the build gate and the type gate.
#
# `npm run lint` used to be excluded here: it reported 9 pre-existing
# react-hooks/set-state-in-effect errors. Each has been resolved (a mix of
# per-line justified disables for false positives — setState after an
# await, or an SSR-safe effect that can't move to render — and one real fix
# for a genuinely synchronous state reset). Lint is now a required step, so
# new violations of any rule fail CI instead of landing silently.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Auth.js reads this at module scope. The build never authenticates
      # anyone; the value just must not be missing. Not a real credential.
      AUTH_SECRET: build-time-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v7

      # v4 targeted Node 20, which the runners now force onto Node 24 while
      # printing a deprecation warning — a warning today, a hard failure
      # whenever that shim is withdrawn. Better bumped calmly than mid-deploy.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `ci`, not `install`: fails on a package-lock that has drifted from
      # package.json rather than quietly resolving something different.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and typecheck
        run: npm run build
