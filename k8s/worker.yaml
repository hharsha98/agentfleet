apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agentfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: agentfleet-api:local
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: agentfleet-config
            - secretRef:
                name: agentfleet-secrets
          env:
            - name: ORCHESTRATOR_MODE
              value: arq
