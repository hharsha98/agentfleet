apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfleet-config
  namespace: agentfleet
data:
  DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@postgres:5432/agentfleet
  REDIS_URL: redis://redis:6379/0
  SEARXNG_URL: http://searxng:8080
  DEFAULT_MODEL: openai/gpt-oss-120b
  FREE_LLM_BASE_URL: http://localhost:3001/v1
  LANGFUSE_HOST: https://cloud.langfuse.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: agentfleet-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentfleet-config
            - secretRef:
                name: agentfleet-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentfleet
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
