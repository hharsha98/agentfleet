apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfleet-config
  namespace: agentfleet
data:
  DATABASE_URL: postgresql+asyncpg://agentfleet:agentfleet@postgres:5432/agentfleet
  REDIS_URL: redis://redis:6379/0
  # Enqueue runs to the arq worker instead of running them in the API process, so a
  # run survives an api pod restart. k8s/README.md documented this as set on BOTH
  # api and worker; it was set only in worker.yaml, so the API ran missions
  # in-process while an idle worker polled an empty queue.
  ORCHESTRATOR_MODE: arq
  # KNOWN DEFECTS — why this stack has never served traffic. Recorded here rather
  # than silently patched, and fixed properly in the base/overlays rework:
  #   SEARXNG_URL points at a Service that does not exist under k8s/ (compose has
  #     one; these manifests do not). web_search degrades to "no results" instead
  #     of crashing, so it fails quietly — which is worse than failing loudly.
  #   FREE_LLM_BASE_URL is a HOST-machine dev proxy address. Inside a pod,
  #     localhost IS the pod, so every LLM call fails. It also carries a key, so it
  #     belongs in the Secret, not in this ConfigMap.
  SEARXNG_URL: http://searxng:8080
  DEFAULT_MODEL: openai/gpt-oss-120b
  FREE_LLM_BASE_URL: http://localhost:3001/v1
  LANGFUSE_HOST: https://cloud.langfuse.com
---
# NOTE (Phase 12 F2): the one-shot `migrate` Job (migrate-job.yaml) must run
# before api pods can serve — the entrypoint no longer runs migrations
# per-replica (multi-replica race). An initContainer was considered but a Job
# is correct for >1 replica: it runs exactly once cluster-wide. Until the Job
# completes, api pods stay out of the Service via the /health/ready probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: agentfleet-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentfleet-config
            - secretRef:
                name: agentfleet-secrets
          # Readiness = DB answers SELECT 1 (/health/ready); liveness stays
          # the cheap DB-free /health so a slow DB never kills the process.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentfleet
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
