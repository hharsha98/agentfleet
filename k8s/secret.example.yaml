# Template for the api Deployment's `agentfleet-secrets` Secret.
# DO NOT commit real values or `kubectl apply` this file as-is.
#
# Create your own from the repo root .env:
#   kubectl create secret generic agentfleet-secrets \
#     --namespace agentfleet \
#     --from-literal=FREE_LLM_KEY="$FREE_LLM_KEY" \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=PLANNER_MODEL="$PLANNER_MODEL" \
#     --from-literal=LANGFUSE_PUBLIC_KEY="$LANGFUSE_PUBLIC_KEY" \
#     --from-literal=LANGFUSE_SECRET_KEY="$LANGFUSE_SECRET_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: agentfleet-secrets
  namespace: agentfleet
type: Opaque
stringData:
  FREE_LLM_KEY: PLACEHOLDER
  ANTHROPIC_API_KEY: PLACEHOLDER
  PLANNER_MODEL: PLACEHOLDER
  LANGFUSE_PUBLIC_KEY: PLACEHOLDER
  LANGFUSE_SECRET_KEY: PLACEHOLDER
