apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: agentfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: agentfleet-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: HOSTNAME
              value: 0.0.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: agentfleet
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30302
