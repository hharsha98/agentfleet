# Base layer (Wave 3B restructure). Not applied directly — see
# k8s/overlays/dev/ and k8s/overlays/prod/, which both layer patches onto
# this via `resources: [../../base]`. k8s/README.md documents which one to
# actually run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentfleet

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
